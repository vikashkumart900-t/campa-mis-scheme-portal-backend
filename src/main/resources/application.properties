# Application Configuration
spring.application.name=campa-scheme-mis-portal


# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campa_mis
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=DEBUG


parivesh.base-url=https://stgdev.parivesh.nic.in/parivesh2_dev/
parivesh.secret-key=welcomeToParivesh


# HikariCP connection pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

# Idle timeout: 6 hours (21,600,000 milliseconds)
spring.datasource.hikari.idle-timeout=21600000

# Connection acquisition timeout: 30 seconds
spring.datasource.hikari.connection-timeout=30000


## Logback configuration file
logging.config=classpath:logback.xml

